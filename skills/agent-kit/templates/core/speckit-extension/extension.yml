schema_version: "1.0"

extension:
  id: agent-kit-audit
  name: "agent-kit Audit Gate"
  version: "1.0.0"
  description: "Fresh-context audit gate for spec and plan artifacts — an author cannot close its own quality gate (agent-kit AGENTS.md §10/§13)"
  author: agent-kit
  repository: https://github.com/tylersilva/agent-kit
  license: MIT

requires:
  speckit_version: ">=0.2.0"

provides:
  commands:
    - name: speckit.agent-kit-audit.gate
      file: commands/speckit.agent-kit-audit.gate.md
      description: "Run the fresh-context document-artifact audit on the artifact just produced, before the next stage consumes it"

hooks:
  after_specify:
    command: speckit.agent-kit-audit.gate
    optional: false
    description: "Audit the specification before clarify/plan consumes it"
  after_plan:
    command: speckit.agent-kit-audit.gate
    optional: false
    description: "Audit the plan before tasks/implement consumes it"

tags:
  - "audit"
  - "quality"
  - "agent-kit"
